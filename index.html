<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex,nofollow" />
  <title>STARGET — SYSTEM UPDATE</title>
  <style>
    :root{--bg:#050505;--fg:#f3f3ee;--muted:rgba(243,243,238,.42);--line:rgba(255,255,255,.12);--red:#e00020}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100svh;overflow:hidden}
    .page{position:relative;min-height:100svh;display:grid;place-items:center;padding:28px;isolation:isolate}
    .grid{position:absolute;inset:-15%;z-index:-2;background-image:linear-gradient(rgba(224,0,32,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(224,0,32,.05) 1px,transparent 1px);background-size:44px 44px;transform:perspective(900px) rotateX(64deg) translateY(34%);transform-origin:center bottom;animation:grid 18s linear infinite;mask-image:radial-gradient(circle at 50% 78%,#000,transparent 66%)}
    .scan{position:absolute;left:0;right:0;top:-3%;height:1px;background:linear-gradient(90deg,transparent,rgba(224,0,32,.78),transparent);box-shadow:0 0 20px rgba(224,0,32,.28);animation:scan 7.5s ease-in-out infinite}
    .corner{position:absolute;top:28px;left:28px;width:10px;height:10px;border:1px solid var(--red);transform:rotate(45deg)}
    .corner:after{content:"";position:absolute;inset:2px;background:var(--red)}
    .meta{position:absolute;right:28px;top:26px;display:grid;gap:7px;text-align:right;font:600 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2em;color:var(--muted)}
    .panel{width:min(760px,100%);border-top:1px solid rgba(224,0,32,.56);padding-top:22px}
    .eyebrow{font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.23em;color:var(--red);margin-bottom:18px}
    h1{margin:0;font:800 clamp(46px,8vw,104px)/.82 Arial,Helvetica,sans-serif;letter-spacing:-.065em}
    .sub{margin:28px 0 0;max-width:560px;color:rgba(243,243,238,.68);font:500 clamp(14px,1.4vw,18px)/1.7 Arial,Helvetica,sans-serif}
    .jp{display:block;margin-top:9px;color:var(--muted);font-size:12px;letter-spacing:.08em}
    .status{margin-top:48px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding-top:14px;font:600 9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:var(--muted)}
    .dot{display:inline-block;width:6px;height:6px;margin-right:9px;border-radius:50%;background:var(--red);box-shadow:0 0 14px rgba(224,0,32,.7);animation:pulse 1.8s ease-in-out infinite}
    @keyframes grid{to{background-position:44px 44px}}
    @keyframes scan{0%,100%{transform:translateY(0);opacity:0}14%,84%{opacity:1}50%{transform:translateY(96svh)}}
    @keyframes pulse{50%{opacity:.22;transform:scale(.65)}}
    @media(max-width:600px){.page{padding:20px}.meta{top:20px;right:20px}.corner{top:22px;left:22px}.status{flex-direction:column;gap:8px}.panel{padding-top:18px}}
    @media(prefers-reduced-motion:reduce){.grid,.scan,.dot{animation:none}}
  </style>
</head>
<body>
  <main class="page" aria-labelledby="title">
    <div class="grid" aria-hidden="true"></div>
    <div class="scan" aria-hidden="true"></div>
    <div class="corner" aria-hidden="true"></div>
    <div class="meta" aria-hidden="true"><span>STARGET / SYSTEM</span><span>ACCESS STATE / HOLD</span></div>
    <section class="panel">
      <div class="eyebrow">SYSTEM UPDATE / PREPARATION</div>
      <h1 id="title">ACCESS<br>SUSPENDED</h1>
      <p class="sub">STARGET is currently being prepared for the next update.<span class="jp">更新準備中のため、現在アクセスできません。</span></p>
      <div class="status"><span><i class="dot"></i>MAINTENANCE MODE</span><span>NO ACCESS / TEMPORARY</span></div>
    </section>
  </main>
</body>
</html>
