<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="STARGET access gate." />
  <title>STARGET — ACCESS 01</title>
  <link rel="stylesheet" href="kairo/styles.css?v=36" />
  <script src="access-core.js?v=36"></script>
  <script>window.STARGET_GATE_STATE=window.STARGET_ACCESS?.guardGate("pin");</script>
  <style>
    html,body{margin:0;min-height:100%;background:#050505}
    body{min-height:100svh;overflow:hidden}
    .welcome-gate{position:fixed!important}
  </style>
</head>
<body>
  <div id="welcomeGate" class="welcome-gate" role="dialog" aria-modal="true" aria-label="STARGET welcome access">
    <div class="welcome-grid" aria-hidden="true"></div>
    <div class="welcome-scan" aria-hidden="true"></div>
    <div class="welcome-mark" aria-hidden="true"><span></span></div>
    <div class="welcome-center">
      <span id="welcomeIndex" class="welcome-index">ENTRY / 000</span>
      <strong>STARGET</strong>
      <small>DIGITAL CULTURE / TOKYO</small>
    </div>
    <div class="welcome-meta" aria-hidden="true">
      <span id="gateMeta">GATE / ST-01</span>
      <span id="gateRole">PRIMARY ACCESS</span>
    </div>
    <form id="welcomeForm" class="welcome-access" autocomplete="off">
      <label id="accessLabel" for="welcomeCode">ACCESS / 01</label>
      <div class="welcome-input-line">
        <input id="welcomeCode" name="welcomeCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Enter first access code" />
        <button type="submit" aria-label="Enter STARGET">ENTER ↗</button>
      </div>
      <span id="welcomeStatus" class="welcome-status">4 DIGIT / REQUIRED</span>
    </form>
  </div>
  <script>
    (()=>{
      const ACCESS_CODE='5150';
      const gateState=window.STARGET_GATE_STATE;
      if(!gateState)return;
      const accessNo=window.STARGET_ACCESS.ordinal(gateState);
      const accessLabel=document.querySelector('#accessLabel');
      const welcomeIndex=document.querySelector('#welcomeIndex');
      const gateRole=document.querySelector('#gateRole');
      if(accessLabel)accessLabel.textContent=`ACCESS / ${accessNo}`;
      if(welcomeIndex)welcomeIndex.textContent=`ENTRY / ${String(gateState.step-1).padStart(3,'0')}`;
      if(gateRole)gateRole.textContent=`RANDOMIZED GATE ${accessNo} / 03`;
      const gate=document.querySelector('#welcomeGate');
      const form=document.querySelector('#welcomeForm');
      const input=document.querySelector('#welcomeCode');
      const status=document.querySelector('#welcomeStatus');

      const deny=()=>{
        gate?.classList.remove('welcome-denied');
        void gate?.offsetWidth;
        gate?.classList.add('welcome-denied');
        if(status)status.textContent=`ACCESS ${accessNo} DENIED`;
        if(input){input.value='';input.focus();}
        window.setTimeout(()=>{if(status)status.textContent='4 DIGIT / REQUIRED';},1100);
      };

      window.setTimeout(()=>input?.focus(),450);
      input?.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'');});
      form?.addEventListener('submit',(event)=>{
        event.preventDefault();
        if((input?.value||'').trim()!==ACCESS_CODE){deny();return;}
        gate?.classList.add('welcome-granted');
        const next=window.STARGET_ACCESS.completeGate('pin');
        if(status)status.textContent=`ACCESS ${accessNo} GRANTED / ROUTING`;
        window.setTimeout(()=>{window.location.href=next;},650);
      });
    })();
  </script>
</body>
</html>
